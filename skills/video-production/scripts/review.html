<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字幕审核 - 红华管家</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #252525;
      padding: 12px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .header h1 { font-size: 16px; color: #fff; }
    .header .subtitle { font-size: 13px; color: #888; }
    .main { flex: 1; display: flex; overflow: hidden; }
    .video-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
      min-width: 0;
    }
    .video-wrap {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .no-video {
      color: #555;
      font-size: 14px;
      text-align: center;
      padding: 40px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-primary:hover { background: #45a049; }
    .btn-secondary { background: #333; color: #ddd; }
    .btn-secondary:hover { background: #444; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #da190b; }
    .btn-warning { background: #ff9800; color: white; }
    .btn-warning:hover { background: #e68a00; }
    select.speed-select {
      padding: 8px 10px;
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .time-display {
      font-family: monospace;
      font-size: 13px;
      color: #888;
      margin-left: auto;
    }
    .subtitle-panel {
      width: 420px;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .subtitle-header {
      padding: 12px 15px;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .subtitle-header h2 {
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats {
      font-size: 12px;
      color: #888;
    }
    .stats .ok { color: #4CAF50; }
    .stats .sel { color: #ff9800; }
    .subtitle-list {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.8;
    }
    .subtitle-item {
      padding: 8px 15px;
      border-bottom: 1px solid #252525;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: background 0.1s;
    }
    .subtitle-item:hover { background: #252525; }
    .subtitle-item.selected {
      background: #3a1a1a;
      border-left: 3px solid #f44336;
    }
    .subtitle-item.current {
      background: #1a2a4a;
      border-left: 3px solid #2196F3;
    }
    .sub-time {
      font-family: monospace;
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      min-width: 85px;
      padding-top: 2px;
    }
    .sub-text {
      flex: 1;
      word-break: break-all;
    }
    .sub-text mark {
      background: transparent;
      color: inherit;
    }
    .subtitle-item.selected .sub-text {
      text-decoration: line-through;
      color: #f44336;
    }
    .help-bar {
      padding: 8px 15px;
      background: #252525;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #666;
    }
    .help-bar span { margin-right: 15px; }
    .status-bar {
      padding: 6px 15px;
      background: #1a3a1a;
      color: #4CAF50;
      font-size: 12px;
    }
    .status-bar.error { background: #3a1a1a; color: #f44336; }
    .status-bar.info { background: #1a1a3a; color: #64B5F6; }
    .file-input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .file-input-wrap label {
      font-size: 13px;
      cursor: pointer;
      color: #64B5F6;
    }
    .file-input-wrap input[type="file"] { display: none; }
    .delete-summary {
      padding: 10px 15px;
      background: #252525;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #888;
      max-height: 120px;
      overflow-y: auto;
    }
    .delete-summary pre {
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #555;
    }
    .empty-state h3 { font-size: 15px; margin-bottom: 10px; color: #777; }
    .empty-state p { font-size: 13px; line-height: 1.8; }
  </style>
</head>
<body>

<div class="header">
  <h1>🎬 字幕审核</h1>
  <span class="subtitle">红华管家 · 简化版</span>
  <div class="file-input-wrap">
    <label for="videoInput">📹 选择视频</label>
    <input type="file" id="videoInput" accept="video/mp4,video/quicktime,video/*">
    <label for="subtitleInput" style="color:#ff9800;">📝 导入字幕JSON</label>
    <input type="file" id="subtitleInput" accept=".json">
  </div>
  <button class="btn btn-secondary" onclick="loadSample()">📋 加载示例数据</button>
</div>

<div class="main">
  <div class="video-panel">
    <div class="video-wrap" id="videoWrap">
      <video id="video" controls></video>
      <div class="no-video" id="noVideo">请先选择视频文件，或加载示例数据</div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">▶️ 播放</button>
      <select class="speed-select" id="speedSelect" onchange="video.playbackRate=parseFloat(this.value)">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
      <button class="btn btn-warning" onclick="selectAll()">☑️ 全选</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空</button>
      <button class="btn btn-primary" onclick="copyDeleteList()">📋 复制删除列表</button>
      <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
    </div>
    <div class="status-bar" id="statusBar">就绪 · 点击字幕跳转播放，双击选中（删除）</div>
  </div>

  <div class="subtitle-panel">
    <div class="subtitle-header">
      <h2>字幕列表 <span id="subCount">(0)</span></h2>
      <div class="stats">
        已选 <span class="sel" id="selCount">0</span> 条 ·
        总时长 <span id="totalDur">0</span>s ·
        删除约 <span class="sel" id="delDur">0</span>s
      </div>
    </div>
    <div class="subtitle-list" id="subtitleList">
      <div class="empty-state">
        <h3>暂无字幕数据</h3>
        <p>请导入字幕JSON文件<br>或点击"加载示例数据"试用</p>
      </div>
    </div>
    <div class="delete-summary" id="deleteSummary" style="display:none">
      <strong>删除片段预览：</strong>
      <pre id="deletePreview"></pre>
    </div>
    <div class="help-bar">
      <span>🖱️ 单击=跳转</span>
      <span>🖱️ 双击=选中/取消</span>
      <span>⌨️ 空格=播放/暂停</span>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const noVideo = document.getElementById('noVideo');
const subtitleList = document.getElementById('subtitleList');
const timeDisplay = document.getElementById('timeDisplay');
const statusBar = document.getElementById('statusBar');
const subCount = document.getElementById('subCount');
const selCount = document.getElementById('selCount');
const totalDur = document.getElementById('totalDur');
const delDur = document.getElementById('delDur');
const deleteSummary = document.getElementById('deleteSummary');
const deletePreview = document.getElementById('deletePreview');
const playBtn = document.getElementById('playBtn');

let subtitles = [];
let selected = new Set();
let currentIdx = -1;

// --- 加载字幕JSON ---
document.getElementById('subtitleInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      subtitles = JSON.parse(ev.target.result);
      if (!Array.isArray(subtitles)) throw new Error('格式错误');
      selected.clear();
      renderSubtitles();
      setStatus(`已加载 ${subtitles.length} 条字幕`, 'info');
    } catch(err) {
      setStatus('❌ JSON格式错误: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
});

// --- 加载视频 ---
document.getElementById('videoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  noVideo.style.display = 'none';
  video.style.display = 'block';
  setStatus('视频已加载', 'info');
});

// --- 渲染字幕列表 ---
function renderSubtitles() {
  subCount.textContent = `(${subtitles.length})`;
  totalDur.textContent = subtitles.length > 0
    ? (subtitles[subtitles.length-1].end - subtitles[0].start).toFixed(1)
    : 0;
  updateStats();

  if (subtitles.length === 0) {
    subtitleList.innerHTML = '<div class="empty-state"><h3>暂无字幕</h3></div>';
    return;
  }

  subtitleList.innerHTML = subtitles.map((s, i) => `
    <div class="subtitle-item" data-idx="${i}" onclick="onItemClick(${i}, event)" ondblclick="onItemDblClick(${i})">
      <span class="sub-time">${fmtTime(s.start)} → ${fmtTime(s.end)}</span>
      <span class="sub-text">${escHtml(s.text || '')}</span>
    </div>
  `).join('');
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- 点击：跳转播放 ---
function onItemClick(idx, event) {
  const s = subtitles[idx];
  if (!s) return;
  // 阻止双击事件的触发
  event.stopPropagation();
  video.currentTime = s.start;
  video.play().catch(()=>{});
  highlightCurrent(idx);
}

// --- 双击：选中/取消 ---
function onItemDblClick(idx) {
  if (selected.has(idx)) {
    selected.delete(idx);
  } else {
    selected.add(idx);
  }
  renderSubtitles();
  updateStats();
  highlightCurrent(idx);
}

function highlightCurrent(idx) {
  document.querySelectorAll('.subtitle-item').forEach((el, i) => {
    el.classList.toggle('current', i === idx);
  });
  currentIdx = idx;
  const el = document.querySelector(`.subtitle-item[data-idx="${idx}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- 时间更新 & 高亮 ---
video.addEventListener('timeupdate', () => {
  const t = video.currentTime;
  const idx = subtitles.findIndex(s => t >= s.start && t < s.end);
  if (idx >= 0 && idx !== currentIdx) {
    highlightCurrent(idx);
  }
  // 更新时间
  const dur = video.duration || 0;
  timeDisplay.textContent = `${fmtTime2(t)} / ${fmtTime2(dur)}`;
});

video.addEventListener('play', () => playBtn.textContent = '⏸️ 暂停');
video.addEventListener('pause', () => playBtn.textContent = '▶️ 播放');

// --- 播放控制 ---
function togglePlay() {
  if (video.paused) video.play().catch(()=>{});
  else video.pause();
}

// --- 全选 ---
function selectAll() {
  subtitles.forEach((_, i) => selected.add(i));
  renderSubtitles();
  updateStats();
  setStatus(`已全选 ${selected.size} 条`);
}

// --- 清空 ---
function clearAll() {
  selected.clear();
  renderSubtitles();
  updateStats();
  setStatus('已清空选择');
}

// --- 更新统计 ---
function updateStats() {
  selCount.textContent = selected.size;
  let del = 0;
  selected.forEach(i => {
    const s = subtitles[i];
    if (s) del += (s.end - s.start);
  });
  delDur.textContent = del.toFixed(1);
  updateDeletePreview();
}

// --- 删除预览 ---
function updateDeletePreview() {
  if (selected.size === 0) {
    deleteSummary.style.display = 'none';
    return;
  }
  deleteSummary.style.display = 'block';
  const segments = [];
  Array.from(selected).sort((a,b)=>a-b).forEach(i => {
    const s = subtitles[i];
    if (s) segments.push({ start: s.start, end: s.end });
  });
  deletePreview.textContent = JSON.stringify(segments, null, 2);
}

// --- 复制删除列表 ---
function copyDeleteList() {
  if (selected.size === 0) {
    setStatus('⚠️ 请先选中要删除的字幕', 'info');
    return;
  }
  const segments = [];
  Array.from(selected).sort((a,b)=>a-b).forEach(i => {
    const s = subtitles[i];
    if (s) segments.push({ start: parseFloat(s.start.toFixed(3)), end: parseFloat(s.end.toFixed(3)) });
  });

  // 合并相邻片段（间隔<0.1s视为相邻）
  const merged = [];
  for (const seg of segments) {
    if (merged.length === 0) {
      merged.push({...seg});
    } else {
      const last = merged[merged.length - 1];
      if (Math.abs(seg.start - last.end) < 0.1) {
        last.end = seg.end;
      } else {
        merged.push({...seg});
      }
    }
  }

  const json = JSON.stringify(merged, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    setStatus(`✅ 已复制 ${merged.length} 个删除片段（已合并相邻片段）`);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    setStatus(`✅ 已复制（fallback模式）`);
  });
}

// --- 键盘快捷键 ---
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowLeft') {
    video.currentTime = Math.max(0, video.currentTime - (e.shiftKey ? 5 : 1));
  } else if (e.code === 'ArrowRight') {
    video.currentTime = video.currentTime + (e.shiftKey ? 5 : 1);
  }
});

// --- 加载示例数据 ---
function loadSample() {
  subtitles = [
    { start: 0.00, end: 2.52, text: '客户一上来就问唐姐' },
    { start: 2.52, end: 4.80, text: '你家TPE一吨多少钱我说' },
    { start: 5.54, end: 7.84, text: '因为你一上来问价格' },
    { start: 8.14, end: 10.08, text: '我反而不敢跟你报价了' },
    { start: 10.26, end: 10.86, text: '为什么呢？' },
    { start: 11.24, end: 12.60, text: '因为TPE的材料' },
    { start: 12.60, end: 13.98, text: '它名称是一样的' },
    { start: 14.28, end: 15.82, text: '但是它应用的场景不同' },
    { start: 16.42, end: 18.34, text: '当然还有配方也不一样。' },
    { start: 18.94, end: 21.32, text: '不管你是说做玩具' },
    { start: 21.60, end: 23.80, text: '还是说做汽车内饰' },
    { start: 23.98, end: 26.26, text: '或者是说做汽车密封件的' },
    { start: 26.42, end: 27.90, text: '这些要求都不一样。' },
    { start: 28.46, end: 30.74, text: '如果说你不知道软硬度' },
    { start: 31.06, end: 32.50, text: '或者是说手感啊' },
    { start: 32.92, end: 33.52, text: '然后耐候性' },
    { start: 33.84, end: 35.20, text: '这些都不在要求的情况下' },
    { start: 35.46, end: 36.54, text: '我就直接给你报价' },
    { start: 36.96, end: 38.10, text: '那不是在害你吗？' },
    { start: 38.24, end: 39.92, text: '所以你不要觉得我架子大' },
    { start: 39.92, end: 41.94, text: '我不问清楚就给你报价' },
    { start: 41.94, end: 43.96, text: '你把材料拿回去到时候出了问题' },
    { start: 43.96, end: 45.92, text: '亏的是你自己呀' },
    { start: 47.88, end: 50.66, text: '如果说你拿不准用什么材料' },
    { start: 50.92, end: 52.38, text: '你把你合格的样板' },
    { start: 52.38, end: 53.02, text: '快递给到我' },
    { start: 53.16, end: 54.28, text: '免费给你分析' },
    { start: 54.46, end: 55.16, text: '给你推荐材料' },
  ];
  selected.clear();
  renderSubtitles();
  setStatus(`已加载 ${subtitles.length} 条示例字幕（EP01前28条）`, 'info');
}

// --- 工具函数 ---
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(2);
  return `${m.toString().padStart(2,'0')}:${sec.padStart(5,'0')}`;
}

function fmtTime2(s) {
  if (!s || isNaN(s)) return '00:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

function setStatus(msg, type='') {
  statusBar.textContent = msg;
  statusBar.className = 'status-bar' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
